<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Factugest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body { padding-top: 60px; }
        .sidebar { top: 60px; height: calc(100vh - 60px); }
        .content { margin-left: 240px; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm" id="miNavbar"
     style="background: linear-gradient(135deg, #4e73df, #6ea0f5);">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <img th:src="@{/img/logodark.png}" alt="Logo" width="35" height="35">
            <span class="fw-bold small tracking-wider">FACTUGEST</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/invoice/new}">
                        <i class="bi bi-plus-square"></i> Nueva Factura
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/products/product}">
                        <i class="bi bi-box"></i> Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/customer}">
                        <i class="bi bi-person-plus"></i> Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/invoice}">
                        <i class="bi bi-receipt"></i> Facturas
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <div class="dropdown">
                    <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#"
                       id="userDropdown" data-bs-toggle="dropdown">
                        <div class="text-end me-2 d-none d-sm-block">
                            <div class="text-white small fw-bold" style="line-height: 1;"
                                 sec:authentication="principal.nombre">Usuario</div>
                            <small class="text-white-50" style="font-size: 0.7rem;"
                                   sec:authentication="principal.rol">Rol</small>
                        </div>
                        <div class="rounded-circle border border-2 border-white shadow-sm d-flex align-items-center justify-content-center"
                             style="width:35px;height:35px;background:rgba(255,255,255,0.2);">
                            <i class="bi bi-person-fill text-white" style="font-size:1.1rem;"></i>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item py-2" th:href="@{/users}">
                                <i class="bi bi-people me-2"></i> Usuarios
                            </a>
                        </li>
                        <li><a class="dropdown-item py-2" th:href="@{/settings}">
                            <i class="bi bi-gear me-2"></i> Configuración</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit"
                                        class="dropdown-item py-2 text-danger border-0 bg-transparent w-100 text-start">
                                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="sidebar d-flex flex-column">
    <div class="flex-grow-1 overflow-y-auto px-2 custom-scrollbar">

        <div class="mb-2">
            <a class="d-flex justify-content-between align-items-center text-uppercase opacity-75 sidebar-header"
               data-bs-toggle="collapse" href="#collapseBilling" role="button" aria-expanded="true">
                <span><i class="bi bi-receipt me-2"></i> Facturación</span>
                <i class="bi bi-chevron-down small"></i>
            </a>
            <div class="collapse show" id="collapseBilling">
                <a th:href="@{/invoice}" class="ps-4 py-2 small">
                    <i class="bi bi-file-earmark-text me-1"></i> Facturas
                </a>
                <a th:href="@{/invoice/new}" class="ps-4 py-2 small">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Factura
                </a>
                <a th:href="@{/invoice_payments}" class="ps-4 py-2 small">
                    <i class="bi bi-credit-card me-1"></i> Estados de Pago
                </a>
                <a th:href="@{/discount}" class="ps-4 py-2 small">
                    <i class="bi bi-tag me-1"></i> Descuentos
                </a>
                <a th:href="@{/invoice_taxes}" class="ps-4 py-2 small">
                    <i class="bi bi-percent me-1"></i> Impuestos
                </a>
            </div>
        </div>

        <div class="mb-2">
            <a class="d-flex justify-content-between align-items-center text-uppercase opacity-75 sidebar-header"
               data-bs-toggle="collapse" href="#collapseCatalog" role="button" aria-expanded="false" aria-controls="collapseCatalog">
                <span><i class="bi bi-box-seam me-2"></i> Catálogo</span>
                <i class="bi bi-chevron-down small"></i>
            </a>
            <div class="collapse" id="collapseCatalog">
                <a th:href="@{/products/product}" class="ps-4 py-2 small">
                    <i class="bi bi-box me-1"></i> Productos
                </a>
                <a th:href="@{/payment_methods}" class="ps-4 py-2 small">
                    <i class="bi bi-wallet2 me-1"></i> Métodos de Pago
                </a>
            </div>
        </div>

        <div class="mb-2">
            <a class="d-flex justify-content-between align-items-center text-uppercase opacity-75 sidebar-header"
               data-bs-toggle="collapse" href="#collapseMgmt" role="button" aria-expanded="false" aria-controls="collapseMgmt">
                <span><i class="bi bi-person-badge me-2"></i> Administración</span>
                <i class="bi bi-chevron-down small"></i>
            </a>
            <div class="collapse" id="collapseMgmt">
                <a th:href="@{/customer}" class="ps-4 py-2 small">
                    <i class="bi bi-people me-1"></i> Clientes
                </a>
                <a th:href="@{/branches}" class="ps-4 py-2 small">
                    <i class="bi bi-building me-1"></i> Empresas
                </a>
                <a th:href="@{/users}" class="ps-4 py-2 small" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-person-gear me-1"></i> Usuarios
                </a>
                <a th:href="@{/logs}" class="ps-4 py-2 small" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-journal-text me-1"></i> Logs
                </a>
            </div>
        </div>

    </div>

    <div class="mt-auto">
        <hr class="mx-3 border-light opacity-25">
        <a th:href="@{/settings}" class="ps-3 py-2 small d-flex align-items-center">
            <i class="bi bi-gear me-2"></i> Configuración
        </a>
    </div>
</div>

<div class="content">
    <div layout:fragment="content">
        <!-- page content goes here -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div layout:fragment="scripts"></div>
</body>
</html>
