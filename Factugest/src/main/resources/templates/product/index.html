<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Productos</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-box-seam text-primary me-2"></i>Gestión de Productos
            </h1>
            <p class="text-muted mb-0 small">Administra el inventario, precios y stock de productos.</p>
        </div>
        <a th:href="@{/products/product/new}"
           class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-plus-circle-fill"></i> Nuevo Producto
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">Todos los Productos</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">SKU</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Impuesto</th>
                            <th scope="col">Unidad</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="pe-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="10" class="text-center py-5 text-muted">
                                <i class="bi bi-box-seam display-4 d-block mb-3 text-secondary opacity-50"></i>
                                No hay productos registrados.
                            </td>
                        </tr>
                        <tr th:each="product : ${products}" style="transition: all 0.2s;">
                            <td class="ps-4 text-muted small" th:text="${product.cod_producto}"></td>
                            <td>
                                <span class="badge bg-light text-dark border font-monospace" th:text="${product.sku}"></span>
                            </td>
                            <td><span class="fw-bold text-dark" th:text="${product.nombre}"></span></td>
                            <td><span class="text-muted small" th:text="${product.descripcion}"></span></td>
                            <td class="fw-bold text-dark">$<span th:text="${#numbers.formatDecimal(product.precio_unitario, 0, 'COMMA', 2, 'POINT')}"></span></td>
                            <td>
                                <span th:if="${product.stock == 0}" class="text-muted fw-bold">0
                                    <span class="badge bg-secondary text-white border ms-1" style="font-size: 0.6rem;">Sin stock</span>
                                </span>
                                <span th:if="${product.stock > 0 and product.stock <= product.stock_minimo}" class="text-danger fw-bold" th:text="${product.stock}">
                                    <span class="badge bg-danger-subtle text-danger border border-danger-subtle ms-1" style="font-size: 0.6rem;">Bajo</span>
                                </span>
                                <span th:if="${product.stock > product.stock_minimo}" class="text-dark" th:text="${product.stock}"></span>
                            </td>
                            <td>
                                <span class="small text-secondary">
                                    <span th:text="${product.tax_name}"></span> (<span th:text="${product.tax_porcentaje}"></span>%)
                                </span>
                            </td>
                            <td>
                                <span th:if="${product.unidad_medida == 'C62' or product.unidad_medida == '94'}"
                                      class="badge bg-light text-dark border fw-normal">Unidad</span>
                                <span th:if="${product.unidad_medida == 'WSD'}"
                                      class="badge bg-primary-subtle text-primary border border-primary-subtle fw-normal">Servicio</span>
                                <span th:if="${product.unidad_medida == 'KGM'}"
                                      class="badge bg-success-subtle text-success border border-success-subtle fw-normal">Kg</span>
                                <span th:if="${product.unidad_medida != 'C62' and product.unidad_medida != '94' and product.unidad_medida != 'WSD' and product.unidad_medida != 'KGM'}"
                                      class="small text-uppercase text-secondary" th:text="${product.unidad_medida}"></span>
                            </td>
                            <td>
                                <span th:if="${product.activo == 1}"
                                      class="badge rounded-pill bg-success-subtle text-success px-3 border border-success-subtle">Activo</span>
                                <span th:if="${product.activo != 1}"
                                      class="badge rounded-pill bg-secondary-subtle text-secondary px-3 border border-secondary-subtle">Inactivo</span>
                            </td>
                            <td class="pe-4 text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/products/product/edit/{id}(id=${product.cod_producto})}"
                                       class="btn btn-sm btn-light border text-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/products/product/delete/{id}(id=${product.cod_producto})}"
                                       class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                       th:data-name="${product.nombre}" onclick="return confirm('¿Eliminar producto ' + this.dataset.name + '?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex justify-content-between align-items-center">
        <p class="text-muted small mb-0">Mostrando <span th:text="${#lists.size(products)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
