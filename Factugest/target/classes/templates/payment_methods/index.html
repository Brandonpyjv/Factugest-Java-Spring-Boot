<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Métodos de Pago</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-wallet2 text-primary me-2"></i>Métodos de Pago
            </h1>
            <p class="text-muted mb-0 small">Administra los métodos de pago disponibles.</p>
        </div>
        <a th:href="@{/payment_methods/new}"
           class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-plus-circle-fill"></i> Nuevo Método
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">Todos los Métodos de Pago</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">Código</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Nombre</th>
                            <th scope="col" class="pe-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:if="${#lists.isEmpty(all_payment_methods)}">
                            <td colspan="4" class="text-center py-5 text-muted">No hay métodos de pago registrados.</td>
                        </tr>
                        <tr th:each="method : ${all_payment_methods}" style="transition: all 0.2s;">
                            <td class="ps-4 text-dark fw-bold" th:text="${method.codPago}"></td>
                            <td class="fw-bold" th:text="${method.descripcion}"></td>
                            <td class="text-muted" th:text="${method.nombre ?: '—'}"></td>
                            <td class="pe-4 text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/payment_methods/edit/{id}(id=${method.codPago})}"
                                       class="btn btn-sm btn-light border text-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/payment_methods/delete/{id}(id=${method.codPago})}"
                                       class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                       th:data-name="${method.descripcion}" onclick="return confirm('¿Eliminar método de pago ' + this.dataset.name + '?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Mostrando <span th:text="${#lists.size(all_payment_methods)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
