<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Logs</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-journal-text text-primary me-2"></i>Log List
            </h1>
            <p class="text-muted mb-0 small">Track and review user activity logs.</p>
        </div>
        <a th:href="@{/}"
           class="btn btn-light border px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">All Logs</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${not #lists.isEmpty(logs)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">User</th>
                            <th scope="col">Action</th>
                            <th scope="col">Description</th>
                            <th scope="col" class="pe-4">Date</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="log : ${logs}" style="transition: all 0.2s;">
                            <td class="ps-4 text-dark fw-bold" th:text="${log.id_log}"></td>
                            <td class="text-muted" th:text="${log.cod_usuario ?: 'System'}"></td>
                            <td>
                                <span class="badge rounded-pill bg-primary-subtle text-primary px-3 border border-primary-subtle"
                                      th:text="${log.accion}"></span>
                            </td>
                            <td class="text-dark" th:text="${log.descripcion}"></td>
                            <td class="pe-4 text-muted" th:text="${log.fecha}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(logs)}" class="text-center py-5">
                <div class="alert alert-info m-0" style="border-radius: 12px;">
                    <h4 class="mb-1">No logs registered</h4>
                    <p class="mb-0 small text-muted">There are no activity records to display.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Showing <span th:text="${#lists.size(logs)}">0</span> records found in database.</p>
    </div>

</div>
</section>
</body>
</html>
