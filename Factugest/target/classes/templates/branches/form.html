<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${branch != null} ? 'Editar Empresa' : 'Nueva Empresa'">Empresa</title>
</head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="mb-4">
        <h1 class="h3 mb-1 fw-bold">
            <i class="bi bi-building text-primary me-2"></i>
            <span th:text="${branch != null} ? 'Editar Empresa' : 'Nueva Empresa'">Empresa</span>
        </h1>
        <p class="text-muted small mb-0"
           th:text="${branch != null} ? 'Modifica los datos de la empresa.' : 'Registra una nueva empresa o sucursal.'"></p>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-7">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-white py-3 border-bottom border-light">
                    <h6 class="m-0 fw-bold text-primary">Datos de la Empresa</h6>
                </div>
                <div class="card-body p-4">
                    <form th:action="${branch != null} ? @{/branches/edit/{id}(id=${branch.codEmpresa})} : @{/branches/new}" method="POST">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold text-secondary">Nombre de la Empresa *</label>
                                <input type="text" name="nombre" class="form-control bg-light border-0" required
                                       th:value="${branch?.nombre}" placeholder="Ej: Mi Empresa S.A.S.">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-secondary">NIT *</label>
                                <input type="text" name="nit" class="form-control bg-light border-0 font-monospace" required
                                       th:value="${branch?.nit}" placeholder="900123456">
                            </div>

                            <div class="col-md-1">
                                <label class="form-label small fw-bold text-secondary">DV</label>
                                <input type="text" name="dv" class="form-control bg-light border-0 font-monospace text-center"
                                       maxlength="1" th:value="${branch?.dv}" placeholder="0">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary">Tipo Documento</label>
                                <select name="tipo_documento" class="form-select bg-light border-0">
                                    <option value="NIT" th:selected="${branch == null or branch.tipoDocumento == 'NIT'}">NIT</option>
                                    <option value="CC" th:selected="${branch?.tipoDocumento == 'CC'}">Cédula de Ciudadanía</option>
                                    <option value="CE" th:selected="${branch?.tipoDocumento == 'CE'}">Cédula de Extranjería</option>
                                    <option value="PASAPORTE" th:selected="${branch?.tipoDocumento == 'PASAPORTE'}">Pasaporte</option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label small fw-bold text-secondary">Dirección</label>
                                <input type="text" name="direccion" class="form-control bg-light border-0"
                                       th:value="${branch?.direccion}" placeholder="Cll 28 # 9-47">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary">Ciudad</label>
                                <input type="text" name="ciudad" class="form-control bg-light border-0"
                                       th:value="${branch?.ciudad}" placeholder="Bogotá">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary">Teléfono</label>
                                <input type="text" name="telefono" class="form-control bg-light border-0"
                                       th:value="${branch?.telefono}" placeholder="3001234567">
                            </div>

                            <div class="col-md-8">
                                <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                                <input type="email" name="correo" class="form-control bg-light border-0"
                                       th:value="${branch?.correo}" placeholder="empresa@dominio.com">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Régimen Tributario *</label>
                                <select name="regimen_tributario" class="form-select bg-light border-0" required>
                                    <option value="RESPONSABLE_IVA" th:selected="${branch == null or branch.regimenTributario == 'RESPONSABLE_IVA'}">Responsable de IVA</option>
                                    <option value="NO_RESPONSABLE_IVA" th:selected="${branch?.regimenTributario == 'NO_RESPONSABLE_IVA'}">No Responsable de IVA</option>
                                    <option value="GRAN_CONTRIBUYENTE" th:selected="${branch?.regimenTributario == 'GRAN_CONTRIBUYENTE'}">Gran Contribuyente</option>
                                    <option value="AUTORETENEDOR" th:selected="${branch?.regimenTributario == 'AUTORETENEDOR'}">Autoretenedor</option>
                                    <option value="REGIMEN_SIMPLE" th:selected="${branch?.regimenTributario == 'REGIMEN_SIMPLE'}">Régimen Simple de Tributación</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Actividad Económica (CIIU)</label>
                                <input type="text" name="actividad_economica" class="form-control bg-light border-0 font-monospace"
                                       th:value="${branch?.actividadEconomica}" placeholder="Ej: 4711" maxlength="10">
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-4">
                            <a th:href="@{/branches}" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${branch != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</section>
</body>
</html>
