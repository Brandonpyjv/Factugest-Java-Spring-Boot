<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Empresas</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-building text-primary me-2"></i>Gestión de Empresas
            </h1>
            <p class="text-muted mb-0 small">Administra las empresas o sucursales emisoras de facturas.</p>
        </div>
        <a th:href="@{/branches/new}"
           class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-plus-circle-fill"></i> Nueva Empresa
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 fw-bold text-primary">Todas las Empresas</h6>
        </div>
        <div class="card-body p-0">
            <div th:if="${not #lists.isEmpty(branches)}">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                                <th class="ps-4">ID</th>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th>Dirección</th>
                                <th>Ciudad</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th class="pe-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="border-top-0">
                            <tr th:each="branch : ${branches}" style="transition: all 0.2s;">
                                <td class="ps-4 fw-bold text-dark" th:text="${branch.codEmpresa}"></td>
                                <td class="fw-bold" th:text="${branch.nombre}"></td>
                                <td><span class="font-monospace text-muted" th:text="${branch.nit}"></span></td>
                                <td class="text-muted" th:text="${branch.direccion}"></td>
                                <td th:text="${branch.ciudad}"></td>
                                <td th:text="${branch.telefono}"></td>
                                <td class="text-muted" th:text="${branch.correo}"></td>
                                <td class="pe-4 text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/branches/edit/{id}(id=${branch.codEmpresa})}"
                                           class="btn btn-sm btn-light border text-warning" title="Editar">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <a th:href="@{/branches/delete/{id}(id=${branch.codEmpresa})}"
                                           class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                           th:data-name="${branch.nombre}" onclick="return confirm('¿Eliminar empresa ' + this.dataset.name + '?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(branches)}" class="p-5 text-center">
                <i class="bi bi-building display-4 d-block mb-3 text-secondary opacity-50"></i>
                <h5 class="fw-bold mb-1">No hay empresas registradas</h5>
                <p class="text-muted mb-4">Crea tu primera empresa para empezar a facturar.</p>
                <a th:href="@{/branches/new}" class="btn btn-primary px-4">
                    <i class="bi bi-plus-circle-fill me-1"></i> Nueva Empresa
                </a>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Mostrando <span th:text="${#lists.size(branches)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
