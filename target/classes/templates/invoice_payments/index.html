<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Estados de Pago</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-credit-card text-primary me-2"></i>Estados de Pago
            </h1>
            <p class="text-muted mb-0 small">Administra los estados de pago disponibles para facturas.</p>
        </div>
        <a th:href="@{/invoice_payments/new}"
           class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-plus-circle-fill"></i> Nuevo Estado
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">Todos los Estados de Pago</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${not #lists.isEmpty(all_invoices)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">Código</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="pe-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="payment : ${all_invoices}" style="transition: all 0.2s;">
                            <td class="ps-4 text-dark fw-bold" th:text="${payment.codPagoFactura}"></td>
                            <td>
                                <span th:if="${#strings.toLowerCase(payment.status ?: '') == 'paid'}"
                                      class="badge rounded-pill bg-success-subtle text-success px-3 border border-success-subtle">Pagado</span>
                                <span th:if="${#strings.toLowerCase(payment.status ?: '') == 'pending'}"
                                      class="badge rounded-pill bg-warning-subtle text-warning-emphasis px-3 border border-warning-subtle">Pendiente</span>
                                <span th:if="${#strings.toLowerCase(payment.status ?: '') == 'partially paid'}"
                                      class="badge rounded-pill bg-info-subtle text-info-emphasis px-3 border border-info-subtle">Pago Parcial</span>
                                <span th:if="${#strings.toLowerCase(payment.status ?: '') == 'overdue'}"
                                      class="badge rounded-pill bg-danger-subtle text-danger px-3 border border-danger-subtle">Vencido</span>
                                <span th:if="${#strings.toLowerCase(payment.status ?: '') == 'cancelled'}"
                                      class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis px-3 border border-secondary-subtle">Cancelado</span>
                                <span th:if="${payment.status != null
                                    and #strings.toLowerCase(payment.status) != 'paid'
                                    and #strings.toLowerCase(payment.status) != 'pending'
                                    and #strings.toLowerCase(payment.status) != 'partially paid'
                                    and #strings.toLowerCase(payment.status) != 'overdue'
                                    and #strings.toLowerCase(payment.status) != 'cancelled'}"
                                      class="badge rounded-pill bg-light text-dark px-3 border" th:text="${payment.status}"></span>
                            </td>
                            <td class="pe-4 text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/invoice_payments/edit/{id}(id=${payment.codPagoFactura})}"
                                       class="btn btn-sm btn-light border text-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/invoice_payments/delete/{id}(id=${payment.codPagoFactura})}"
                                       class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                       th:data-name="${payment.status}" onclick="return confirm('¿Eliminar estado de pago ' + this.dataset.name + '?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(all_invoices)}" class="text-center py-5 text-muted">
                <i class="bi bi-credit-card display-4 d-block mb-3 opacity-50"></i>
                <p>No hay estados de pago registrados.</p>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Mostrando <span th:text="${#lists.size(all_invoices)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
