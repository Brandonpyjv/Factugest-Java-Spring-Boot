<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${payment != null} ? 'Editar Estado de Pago' : 'Nuevo Estado de Pago'">Estado de Pago</title>
</head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="mb-4">
        <h1 class="h3 mb-1 fw-bold">
            <i class="bi bi-credit-card text-primary me-2"></i>
            <span th:text="${payment != null} ? 'Editar Estado de Pago' : 'Nuevo Estado de Pago'">Estado de Pago</span>
        </h1>
        <p class="text-muted small mb-0">Define un estado de pago disponible para las facturas.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-5 col-md-7">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-white py-3 border-bottom border-light">
                    <h6 class="m-0 fw-bold text-primary">Estado de Pago</h6>
                </div>
                <div class="card-body p-4">
                    <form th:action="${payment != null} ? @{/invoice_payments/edit/{id}(id=${payment.codPagoFactura})} : @{/invoice_payments/new}" method="POST">

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Estado *</label>
                            <input type="text" name="status" class="form-control bg-light border-0" required
                                   th:value="${payment?.status}" placeholder="Ej: paid, pending, overdue">
                            <div class="form-text">Valores sugeridos: paid, pending, partially paid, overdue, cancelled, disputed, refunded</div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/invoice_payments}" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${payment != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</section>
</body>
</html>
