<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Impuestos</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-percent text-primary me-2"></i>Gestión de Impuestos
            </h1>
            <p class="text-muted mb-0 small">Administra los tipos de impuestos del sistema.</p>
        </div>
        <a th:href="@{/invoice_taxes/new}"
           class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-plus-circle-fill"></i> Nuevo Impuesto
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">Todos los Impuestos</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${not #lists.isEmpty(all_taxes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Descripción</th>
                            <th scope="col" class="text-end">Porcentaje</th>
                            <th scope="col" class="pe-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="tax : ${all_taxes}" style="transition: all 0.2s;">
                            <td class="ps-4 text-dark fw-bold" th:text="${tax.codImpuesto}"></td>
                            <td class="fw-bold" th:text="${tax.descripcion}"></td>
                            <td class="text-end">
                                <span class="badge rounded-pill bg-success-subtle text-success px-3 border border-success-subtle"
                                      th:text="${tax.porcentaje + '%'}"></span>
                            </td>
                            <td class="pe-4 text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/invoice_taxes/edit/{id}(id=${tax.codImpuesto})}"
                                       class="btn btn-sm btn-light border text-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/invoice_taxes/delete/{id}(id=${tax.codImpuesto})}"
                                       class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                       th:data-name="${tax.descripcion}" onclick="return confirm('¿Eliminar impuesto ' + this.dataset.name + '?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(all_taxes)}" class="p-5 text-center">
                <i class="bi bi-percent display-4 d-block mb-3 text-secondary opacity-50"></i>
                <h5 class="fw-bold mb-1">No hay impuestos registrados</h5>
                <a th:href="@{/invoice_taxes/new}" class="btn btn-primary px-4 mt-3">
                    <i class="bi bi-plus-circle-fill me-1"></i> Nuevo Impuesto
                </a>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Mostrando <span th:text="${#lists.size(all_taxes)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
