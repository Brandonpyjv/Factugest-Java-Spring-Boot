<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Cerrada | Factugest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a8f 0%, #4e73df 45%, #6ea0f5 75%, #224abe 100%);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-bubbles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: floatUp linear infinite;
        }

        .bubble:nth-child(1)  { width: 320px; height: 320px; left: -120px; bottom: -100px; animation-duration: 18s; }
        .bubble:nth-child(2)  { width: 200px; height: 200px; right: -60px; top: 10%;    animation-duration: 14s; animation-delay: -4s; }
        .bubble:nth-child(3)  { width: 120px; height: 120px; left: 30%;   top: -40px;   animation-duration: 20s; animation-delay: -8s; }
        .bubble:nth-child(4)  { width: 80px;  height: 80px;  right: 20%;  bottom: 15%;  animation-duration: 12s; animation-delay: -2s; }
        .bubble:nth-child(5)  { width: 160px; height: 160px; left: 60%;   bottom: -60px; animation-duration: 16s; animation-delay: -6s; }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0.4; }
            50%  { transform: translateY(-30px) rotate(10deg) scale(1.05); opacity: 0.6; }
            100% { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0.4; }
        }

        .logout-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .logout-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px 40px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-box {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #4e73df, #6ea0f5);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(78, 115, 223, 0.45);
            transition: transform 0.3s ease;
        }

        .logo-box:hover { transform: scale(1.05) rotate(-2deg); }

        .logo-box img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .app-name {
            font-size: 1.9rem;
            font-weight: 800;
            color: #1a202c;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .app-tagline {
            color: #718096;
            font-size: 0.88rem;
            margin-bottom: 0;
        }

        .check-icon {
            width: 64px;
            height: 64px;
            background: #f0fff4;
            border: 2px solid #c6f6d5;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 28px auto 16px;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }

        .check-icon i { font-size: 1.8rem; color: #276749; }

        .logout-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .logout-message {
            color: #718096;
            font-size: 0.92rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4e73df 0%, #6ea0f5 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 20px rgba(78, 115, 223, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 115, 223, 0.55);
            color: #fff;
        }

        .btn-login:active { transform: translateY(0); }

        .login-footer {
            text-align: center;
            color: #a0aec0;
            font-size: 0.78rem;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f0f4f8;
        }

        .login-footer strong { color: #718096; }

        @media (max-width: 480px) {
            .logout-card { padding: 32px 24px 28px; border-radius: 18px; }
            .app-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="bg-bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="logout-wrapper">
    <div class="logout-card">

        <div class="logo-box">
            <img th:src="@{/img/logodark.png}" alt="Factugest Logo">
        </div>
        <h1 class="app-name">Factugest</h1>
        <p class="app-tagline">Sistema de Facturación Electrónica &bull; Colombia</p>

        <div class="check-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <p class="logout-title">Sesión cerrada correctamente</p>
        <p class="logout-message">
            Has cerrado sesión de forma segura.<br>
            ¿Deseas volver a ingresar?
        </p>

        <a th:href="@{/login}" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i>
            Iniciar Sesión
        </a>

        <div class="login-footer">
            &copy; 2025 <strong>Factugest</strong> &bull; Todos los derechos reservados
        </div>
    </div>
</div>

</body>
</html>
