<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${tax != null} ? 'Editar Impuesto' : 'Nuevo Impuesto'">Impuesto</title>
</head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="mb-4">
        <h1 class="h3 mb-1 fw-bold">
            <i class="bi bi-percent text-primary me-2"></i>
            <span th:text="${tax != null} ? 'Editar Impuesto' : 'Nuevo Impuesto'">Impuesto</span>
        </h1>
        <p class="text-muted small mb-0">Configura el tipo de impuesto para el sistema de facturación.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-5 col-md-7">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-white py-3 border-bottom border-light">
                    <h6 class="m-0 fw-bold text-primary">Datos del Impuesto</h6>
                </div>
                <div class="card-body p-4">
                    <form th:action="${tax != null} ? @{/invoice_taxes/edit/{id}(id=${tax.codImpuesto})} : @{/invoice_taxes/new}" method="POST">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Descripción *</label>
                            <input type="text" name="descripcion" class="form-control bg-light border-0" required
                                   th:value="${tax?.descripcion}" placeholder="Ej: IVA, RETEFUENTE, RETEICA">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Porcentaje *</label>
                            <div class="input-group">
                                <input type="number" name="porcentaje" class="form-control bg-light border-0" required
                                       min="0" max="100" step="0.01"
                                       th:value="${tax?.porcentaje}" placeholder="0.00">
                                <span class="input-group-text bg-light border-0">%</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Código DIAN</label>
                            <select name="codigo_dian" class="form-select bg-light border-0">
                                <option value="" th:selected="${tax == null or tax.codigoDian == null or tax.codigoDian == ''}">— Sin código DIAN —</option>
                                <option value="01" th:selected="${tax?.codigoDian == '01'}">01 — IVA</option>
                                <option value="02" th:selected="${tax?.codigoDian == '02'}">02 — Impoconsumo (IC)</option>
                                <option value="03" th:selected="${tax?.codigoDian == '03'}">03 — ICA</option>
                                <option value="05" th:selected="${tax?.codigoDian == '05'}">05 — ReteFuente</option>
                                <option value="06" th:selected="${tax?.codigoDian == '06'}">06 — ReteICA</option>
                                <option value="07" th:selected="${tax?.codigoDian == '07'}">07 — ReteIVA</option>
                                <option value="08" th:selected="${tax?.codigoDian == '08'}">08 — ReteCREE</option>
                                <option value="ZY" th:selected="${tax?.codigoDian == 'ZY'}">ZY — Exento</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/invoice_taxes}" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${tax != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</section>
</body>
</html>
