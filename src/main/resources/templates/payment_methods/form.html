<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${pm != null} ? 'Editar Método de Pago' : 'Nuevo Método de Pago'">Método de Pago</title>
</head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="mb-4">
        <h1 class="h3 mb-1 fw-bold">
            <i class="bi bi-wallet2 text-primary me-2"></i>
            <span th:text="${pm != null} ? 'Editar Método de Pago' : 'Nuevo Método de Pago'">Método de Pago</span>
        </h1>
        <p class="text-muted small mb-0">Configura un método de pago disponible para las facturas.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-5 col-md-7">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-white py-3 border-bottom border-light">
                    <h6 class="m-0 fw-bold text-primary">Datos del Método de Pago</h6>
                </div>
                <div class="card-body p-4">
                    <form th:action="${pm != null} ? @{/payment_methods/edit/{id}(id=${pm.codPago})} : @{/payment_methods/new}" method="POST">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Descripción *</label>
                            <input type="text" name="descripcion" class="form-control bg-light border-0" required
                                   th:value="${pm?.descripcion}" placeholder="Ej: EFECTIVO, TARJETA CRÉDITO">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Nombre (opcional)</label>
                            <input type="text" name="nombre" class="form-control bg-light border-0"
                                   th:value="${pm?.nombre}" placeholder="Nombre interno del método">
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/payment_methods}" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${pm != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</section>
</body>
</html>
