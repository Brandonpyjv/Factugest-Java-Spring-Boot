<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Usuarios</title></head>
<body>
<section layout:fragment="content">
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="h3 mb-1 text-gray-800 fw-bold">
                <i class="bi bi-people-fill text-primary me-2"></i>Gestión de Usuarios
            </h1>
            <p class="text-muted mb-0 small">Administra los usuarios del sistema.</p>
        </div>
        <a th:href="@{/users/new}" class="btn btn-primary px-4 py-2 shadow-sm d-flex align-items-center gap-2"
           style="border-radius: 8px; font-weight: 600;">
            <i class="bi bi-person-plus-fill"></i> Nuevo Usuario
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h6 class="m-0 font-weight-bold text-primary">Todos los Usuarios</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr class="text-uppercase small fw-bold" style="letter-spacing: 0.5px;">
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Rol</th>
                            <th scope="col" class="pe-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="5" class="text-center py-5 text-muted">No hay usuarios registrados.</td>
                        </tr>
                        <tr th:each="u : ${usuarios}" style="transition: all 0.2s;">
                            <td class="ps-4 fw-bold text-dark" th:text="${u.codUsuario}"></td>
                            <td th:text="${u.nombre}"></td>
                            <td class="text-muted" th:text="${u.correo}"></td>
                            <td>
                                <span class="badge border text-secondary fw-normal" th:text="${u.rol}"></span>
                            </td>
                            <td class="pe-4 text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/users/edit/{id}(id=${u.codUsuario})}"
                                       class="btn btn-sm btn-light border text-warning" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/users/delete/{id}(id=${u.codUsuario})}"
                                       class="btn btn-sm btn-light border text-danger" title="Eliminar"
                                       th:data-name="${u.nombre}" onclick="return confirm('¿Eliminar usuario ' + this.dataset.name + '?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <p class="text-muted small">Mostrando <span th:text="${#lists.size(usuarios)}">0</span> registros.</p>
    </div>

</div>
</section>
</body>
</html>
